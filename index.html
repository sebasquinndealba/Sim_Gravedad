<script>
'use strict';

const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let DPR=Math.max(1,Math.min(2,devicePixelRatio||1));
let W=1200,H=800,PANEL=330,FPS=60;
const BG=[12,15,25],PC=[27,31,45],TXT=[235,235,240],MUT=[155,165,185],BLUE=[70,135,255],RED=[245,70,80],YEL=[255,210,80],GREEN=[105,220,160],CYAN=[70,240,255],AXIS=[65,70,90],TRAIL=[80,100,150],BORDER=[90,95,115];
const G0=2000,GMIN=0,GMAX=10000,C0=1000,CMIN=10,CMAX=10000,SOFT=8,DT=.01,SUB=5,HIST=120,EPS=1e-9;
const SLINGSHOT_SCALE=1,SLINGSHOT_MIN_PIXELS=8,PREDICTION_STEPS=600,PREDICTION_DT=.02,PREDICTION_POINT_EVERY=4,PREDICTION_MAX_SCREEN_DISTANCE=5000,PREDICTION_COLOR=[180,220,255];
const FIELD_PALETTE=[[16,20,39],[27,33,85],[37,50,133],[40,72,175],[36,105,198],[29,140,212],[35,173,205],[45,194,167],[70,204,112],[117,215,75],[174,221,60],[223,218,64],[248,190,65],[250,149,58],[246,102,54],[231,63,75],[197,48,120],[157,53,166]];
const rgb=a=>`rgb(${a[0]},${a[1]},${a[2]})`, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fieldCanvas=document.createElement('canvas'),fieldCtx=fieldCanvas.getContext('2d',{alpha:false});

function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

class Camera{constructor(){this.x=0;this.y=0;this.zoom=1} center(){return [PANEL+(W-PANEL)/2,H/2]} toScreen(x,y){const[cx,cy]=this.center();return[cx+(x-this.x)*this.zoom,cy-(y-this.y)*this.zoom]} toWorld(x,y){const[cx,cy]=this.center();return[this.x+(x-cx)/this.zoom,this.y-(y-cy)/this.zoom]} zoomAt(pos,f){const b=this.toWorld(...pos);this.zoom=clamp(this.zoom*f,.0001,8);const a=this.toWorld(...pos);this.x+=b[0]-a[0];this.y+=b[1]-a[1]} pan(dx,dy){this.x-=dx/this.zoom;this.y+=dy/this.zoom} reset(){this.x=this.y=0;this.zoom=1} follow(b){this.x=b.x;this.y=b.y}}
let nextId=1;
class Body{
 constructor(x,y,m,vx,vy,t,fixed=false){this.id=nextId++;this.x=+x;this.y=+y;this.m=+m;this.vx=+vx;this.vy=+vy;this.fixed=!!fixed;if(this.fixed)this.vx=this.vy=0;this.r=clamp(Math.trunc(Math.cbrt(Math.abs(this.m))),4,70);this.trail=[];this.created=+t;this.destroyed=null;this.history=[[this.created,this.x,this.y,this.m]];this.name=null;this.kinematicMoon=false}
 record(t){const s=[+t,this.x,this.y,this.m];if(this.history.length&&Math.abs(this.history.at(-1)[0]-t)<1e-12)this.history[this.history.length-1]=s;else this.history.push(s);while(this.history.length>2&&this.history[1][0]<t-HIST)this.history.shift()}
 past(t){if(t<this.created||(this.destroyed!==null&&t>=this.destroyed)||!this.history.length||t<this.history[0][0])return null;if(t>=this.history.at(-1)[0])return this.history.at(-1).slice(1);let lo=0,hi=this.history.length-1;while(lo+1<hi){const mid=(lo+hi)>>1;if(this.history[mid][0]<=t)lo=mid;else hi=mid}const a=this.history[lo],b=this.history[hi],q=b[0]===a[0]?0:(t-a[0])/(b[0]-a[0]);return [1,2,3].map(i=>a[i]+(b[i]-a[i])*q)}
 draw(trails,vectors,isSelected){const[x,y]=cam.toScreen(this.x,this.y),r=Math.min(100,Math.max(2,Math.trunc(this.r*Math.sqrt(cam.zoom))));if(trails&&this.trail.length>1){ctx.strokeStyle=rgb(this.kinematicMoon?[135,155,210]:TRAIL);ctx.lineWidth=1;ctx.beginPath();this.trail.forEach((q,i)=>{const p=cam.toScreen(...q);i?ctx.lineTo(...p):ctx.moveTo(...p)});ctx.stroke()}ctx.fillStyle=rgb(this.m>0?BLUE:RED);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle=rgb(TXT);ctx.lineWidth=2;ctx.stroke();if(this.fixed){ctx.strokeStyle=rgb(YEL);ctx.beginPath();ctx.arc(x,y,r+4,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.moveTo(x,y-5);ctx.lineTo(x,y+5);ctx.stroke()}if(isSelected){ctx.strokeStyle='rgb(100,255,140)';ctx.beginPath();ctx.arc(x,y,r+7,0,Math.PI*2);ctx.stroke()}if(vectors&&!this.fixed&&!this.kinematicMoon){const e=cam.toScreen(this.x+this.vx*.5,this.y+this.vy*.5);ctx.strokeStyle=rgb(YEL);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(...e);ctx.stroke();ctx.fillStyle=rgb(YEL);ctx.beginPath();ctx.arc(e[0],e[1],3,0,Math.PI*2);ctx.fill()}if(!this.kinematicMoon)drawText((this.name||`m=${this.m}`)+(this.fixed?' [FIJA]':''),x+r+6,y-r,14,TXT)}
}
const cam=new Camera();let bodies=[],sources=[],selected=null,tracked=null,sim=false,trails=true,cm=true,vectors=true,collisions=true,instant=true,fieldmode=0,g=G0,c=C0,t=0,solarMode=false,gSliderMax=GMAX;let mass='1000',vx='0',vy='0',active=0,energyReference=null,energySignature=null;
let slingActive=false,slingStartScreen=null,slingCurrentScreen=null,slingStartWorld=null,dragCam=false,lastMouse=[0,0],dragG=false,dragC=false;
let mouse=[0,0],keys=new Set();

function sourceState(ox,oy,b,time,cc,inst){if(inst)return b.destroyed!==null?null:[b.x,b.y,b.m];let x=b.x,y=b.y,m=b.m;for(let i=0;i<4;i++){const st=b.past(time-Math.hypot(x-ox,y-oy)/cc);if(!st)return null;[x,y,m]=st}return[x,y,m]}
function field(x,y,src,gg,cc,time,inst,exclude=null){let fx=0,fy=0;for(const b of src){if(b===exclude)continue;const st=sourceState(x,y,b,time,cc,inst);if(!st)continue;const[sx,sy,m]=st,dx=sx-x,dy=sy-y,d2=dx*dx+dy*dy+SOFT*SOFT,k=gg*m*Math.pow(d2,-1.5);fx+=k*dx;fy+=k*dy}return[fx,fy]}
function energyComponents(arr,gg){let kinetic=0,potential=0;for(const b of arr)kinetic+=.5*b.m*(b.vx*b.vx+b.vy*b.vy);for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){const a=arr[i],b=arr[j],d2=(a.x-b.x)**2+(a.y-b.y)**2+SOFT**2;potential-=gg*a.m*b.m/Math.sqrt(d2)}return[kinetic,potential,kinetic+potential]}
function verletStep(arr,src,gg,cc,time,dt,inst){const acc0=arr.map(b=>b.fixed?[0,0]:field(b.x,b.y,src,gg,cc,time,inst,b));arr.forEach((b,i)=>{if(b.fixed)return;const[ax,ay]=acc0[i];b.x+=b.vx*dt+.5*ax*dt*dt;b.y+=b.vy*dt+.5*ay*dt*dt});const nt=time+dt;if(!inst)arr.forEach(b=>b.record(nt));const acc1=arr.map(b=>b.fixed?[0,0]:field(b.x,b.y,src,gg,cc,nt,inst,b));arr.forEach((b,i)=>{if(b.fixed){b.record(nt);return}b.vx+=.5*(acc0[i][0]+acc1[i][0])*dt;b.vy+=.5*(acc0[i][1]+acc1[i][1])*dt;b.record(nt);if(!b.trail.length||Math.hypot(b.x-b.trail.at(-1)[0],b.y-b.trail.at(-1)[1])>=.5)b.trail.push([b.x,b.y]);if(b.trail.length>1500)b.trail.shift()});return nt}
function merge(){let again=true;while(again){again=false;outer:for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){const a=bodies[i],b=bodies[j];if(a.kinematicMoon||b.kinematicMoon||a.fixed||b.fixed)continue;if((a.x-b.x)**2+(a.y-b.y)**2>(a.r+b.r)**2)continue;a.record(t);b.record(t);a.destroyed=b.destroyed=t;const m=a.m+b.m;let n=null;if(Math.abs(m)>=EPS){n=new Body((a.m*a.x+b.m*b.x)/m,(a.m*a.y+b.m*b.y)/m,m,(a.m*a.vx+b.m*b.vx)/m,(a.m*a.vy+b.m*b.vy)/m,t);sources.push(n);bodies.push(n)}if(selected===a||selected===b)selected=n;if(tracked===a||tracked===b)tracked=n;bodies=bodies.filter(x=>x!==a&&x!==b);again=true;break outer}}}

function drawText(msg,x,y,size=14,color=TXT,bold=false){ctx.fillStyle=rgb(color);ctx.font=`${bold?'700 ':''}${size}px Consolas, monospace`;ctx.textBaseline='top';ctx.fillText(msg,x,y)}
function checkbox(x,y,label,on){ctx.strokeStyle=rgb(on?[100,255,140]:BORDER);ctx.lineWidth=2;roundRect(x,y,20,20,3,false,true);if(on){ctx.beginPath();ctx.moveTo(x+4,y+10);ctx.lineTo(x+9,y+15);ctx.lineTo(x+17,y+4);ctx.stroke()}drawText(label,x+28,y+1,14,on?[100,255,140]:TXT)}
function slider(x,y,w,label,val,ratio,lo,hi){drawText(`${label}: ${val}`,20,y-22,14);ctx.fillStyle='rgb(75,82,105)';roundRect(x,y,w,8,4,true,false);ctx.fillStyle='rgb(95,180,255)';roundRect(x,y,w*ratio,8,4,true,false);ctx.fillStyle=rgb(TXT);ctx.beginPath();ctx.arc(x+w*ratio,y+4,9,0,Math.PI*2);ctx.fill();drawText(lo,x,y+11,12,MUT);const tw=ctx.measureText(hi).width;drawText(hi,x+w-tw,y+11,12,MUT)}
function roundRect(x,y,w,h,r,fill=true,stroke=false){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill)ctx.fill();if(stroke)ctx.stroke()}
function hitBody(pos){for(let i=bodies.length-1;i>=0;i--){const b=bodies[i],[x,y]=cam.toScreen(b.x,b.y),r=Math.max(7,Math.trunc(b.r*Math.sqrt(cam.zoom)));if((pos[0]-x)**2+(pos[1]-y)**2<=r*r)return b}return null}
function sval(mx,x,w,a,b,log=false){const q=clamp((mx-x)/w,0,1);return log?10**(Math.log10(a)+q*(Math.log10(b)-Math.log10(a))):a+q*(b-a)}

function drawFieldVectors(){ctx.strokeStyle=rgb(GREEN);ctx.lineWidth=1;for(let sy=10;sy<H;sy+=20)for(let sx=PANEL+10;sx<W;sx+=20){const[wx,wy]=cam.toWorld(sx,sy),[fx,fy]=field(wx,wy,sources,g,c,t,instant),m=Math.hypot(fx,fy);if(m<1e-12)continue;const L=4+Math.tanh(m/80)*22,vxx=fx/m*L,vyy=-fy/m*L;ctx.beginPath();ctx.moveTo(sx-vxx/2,sy-vyy/2);ctx.lineTo(sx+vxx/2,sy+vyy/2);ctx.stroke()}}
function paletteColor(q){
 const scaled=clamp(q,0,1)*(FIELD_PALETTE.length-1),i=Math.floor(scaled),f=scaled-i;
 const a=FIELD_PALETTE[i],b=FIELD_PALETTE[Math.min(FIELD_PALETTE.length-1,i+1)];
 return [
  Math.round(a[0]+(b[0]-a[0])*f),
  Math.round(a[1]+(b[1]-a[1])*f),
  Math.round(a[2]+(b[2]-a[2])*f)
 ]
}
function drawIntensityBands(){
 const sampleStep=6;
 const fieldW=Math.max(2,Math.ceil((W-PANEL)/sampleStep));
 const fieldH=Math.max(2,Math.ceil(H/sampleStep));
 if(fieldCanvas.width!==fieldW||fieldCanvas.height!==fieldH){fieldCanvas.width=fieldW;fieldCanvas.height=fieldH}
 const image=fieldCtx.createImageData(fieldW,fieldH),values=new Float32Array(fieldW*fieldH),positive=[];
 for(let iy=0;iy<fieldH;iy++){
  const sy=(iy+.5)*H/fieldH;
  for(let ix=0;ix<fieldW;ix++){
   const sx=PANEL+(ix+.5)*(W-PANEL)/fieldW;
   const[wx,wy]=cam.toWorld(sx,sy),[fx,fy]=field(wx,wy,sources,g,c,t,instant),v=Math.hypot(fx,fy),idx=iy*fieldW+ix;
   values[idx]=v;
   if(v>1e-12)positive.push(v)
  }
 }
 if(!positive.length)return;
 positive.sort((a,b)=>a-b);
 const low=Math.max(positive[Math.trunc(.05*(positive.length-1))],1e-12),high=Math.max(positive[Math.trunc(.98*(positive.length-1))],low*1.001),llo=Math.log10(low),lhi=Math.log10(high);
 for(let idx=0;idx<values.length;idx++){
  const q=clamp((Math.log10(Math.max(values[idx],1e-12))-llo)/(lhi-llo),0,1),col=paletteColor(q),base=idx*4;
  image.data[base]=col[0];
  image.data[base+1]=col[1];
  image.data[base+2]=col[2];
  image.data[base+3]=255;
 }
 fieldCtx.putImageData(image,0,0);
 ctx.save();
 ctx.imageSmoothingEnabled=true;
 ctx.globalAlpha=.92;
 ctx.drawImage(fieldCanvas,PANEL,0,W-PANEL,H);
 ctx.restore();
 const bx=PANEL+15,by=H-34,bw=Math.min(360,W-PANEL-40);
 for(let i=0;i<bw;i++){
  ctx.fillStyle=rgb(paletteColor(i/Math.max(1,bw-1)));
  ctx.fillRect(bx+i,by,1,11)
 }
 drawText(`|g| ${low.toPrecision(2)}`,bx,by-18,12);
 drawText(`${high.toPrecision(2)} (alto)`,bx+bw-100,by-18,12)
}

function predictTrajectory(x,y,pvx,pvy,radius){const pts=[],start=cam.toScreen(x,y);let px=x,py=y,tt=t;for(let step=0;step<PREDICTION_STEPS;step++){const[ax,ay]=field(px,py,sources,g,c,tt,instant);pvx+=ax*PREDICTION_DT;pvy+=ay*PREDICTION_DT;px+=pvx*PREDICTION_DT;py+=pvy*PREDICTION_DT;tt+=PREDICTION_DT;if(step%PREDICTION_POINT_EVERY===0){const p=cam.toScreen(px,py);pts.push(p);if(Math.hypot(p[0]-start[0],p[1]-start[1])>PREDICTION_MAX_SCREEN_DISTANCE)break}if(collisions){let hit=false;for(const b of bodies)if((px-b.x)**2+(py-b.y)**2<=(radius+b.r)**2){hit=true;break}if(hit)break}}return pts}
function drawDottedTrajectory(pts){const total=Math.max(1,pts.length-1);pts.forEach((p,i)=>{if(p[0]<-5||p[0]>W+5||p[1]<-5||p[1]>H+5)return;const pr=i/total,r=pr<.35?3:2,fade=1-.55*pr;ctx.fillStyle=rgb(PREDICTION_COLOR.map(v=>Math.trunc(v*fade)));ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);ctx.fill()})}

const SOLAR_AU=10000,SOLAR_YEAR=60,SOLAR_MASS=1000000,SOLAR_G=(2*Math.PI/SOLAR_YEAR)**2*SOLAR_AU**3/SOLAR_MASS,SOLAR_DT=1/FPS,SOLAR_DAY=SOLAR_YEAR/365.25636,SOLAR_KM_PER_UNIT=149597870.7/SOLAR_AU;
const SOLAR_PLANETS=[['Mercurio',.3871,1.6601e-7,20],['Venus',.7233,2.4478e-6,80],['Tierra',1,3.0035e-6,150],['Marte',1.5237,3.2272e-7,225],['Jupiter',5.2028,9.5479e-4,290],['Saturno',9.5388,2.8589e-4,330],['Urano',19.1914,4.3662e-5,55],['Neptuno',30.0611,5.1514e-5,190]];
const MOON_DATA={Tierra:[['Luna',384400,27.3217]],Marte:[['Fobos',9376,.31891],['Deimos',23463,1.26244]],Jupiter:[['Metis',128000,.29478],['Adrastea',129000,.29826],['Amaltea',181400,.49818],['Tebe',221900,.6745],['Io',421800,1.76914],['Europa',671100,3.55118],['Ganimedes',1070400,7.15455],['Calisto',1882700,16.68902],['Himalia',11461000,250.56],['Elara',11741000,259.64],['Pasifae',23624000,-743.6],['Sinope',23939000,-758.9]],Saturno:[['Pan',133584,.57505],['Dafnis',136505,.59408],['Atlas',137670,.60169],['Prometeo',139380,.61299],['Pandora',141720,.6285],['Epimeteo',151410,.69433],['Jano',151460,.69466],['Mimas',185539,.94242],['Encelado',238042,1.37022],['Tetis',294672,1.8878],['Dione',377415,2.73692],['Rea',527068,4.5175],['Titan',1221870,15.94542],['Hiperion',1481000,21.2766],['Japeto',3560820,79.3215],['Febe',12952000,-550.48]],Urano:[['Cordelia',49752,.33503],['Ofelia',53764,.3764],['Bianca',59166,.43458],['Crésida',61767,.46357],['Desdemona',62658,.47365],['Julieta',64358,.49307],['Porcia',66097,.5132],['Rosalinda',69927,.55846],['Belinda',75255,.62353],['Puck',86004,.76183],['Miranda',129390,1.41348],['Ariel',191020,2.52038],['Umbriel',266000,4.14418],['Titania',435910,8.70587],['Oberon',583520,13.4632],['Sycorax',12179000,-1288.38]],Neptuno:[['Nayade',48227,.2944],['Talasa',50075,.31148],['Despina',52526,.33466],['Galatea',61953,.42875],['Larisa',73548,.55465],['Hipocampo',105284,.9362],['Proteo',117647,1.12231],['Triton',354759,-5.87685],['Nereida',5513818,360.136],['Halimede',16611000,-1879.7],['Sao',22228000,2912.7],['Laomedeia',23567000,3171],['Neso',48387000,-9740.7]]};
function appendMoons(arr){const planets=Object.fromEntries(arr.filter(b=>b.name).map(b=>[b.name,b]));for(const [hostName,items] of Object.entries(MOON_DATA)){const host=planets[hostName];if(!host)continue;items.forEach((it,index)=>{const[name,km,days]=it,b=new Body(host.x,host.y,0,0,0,0);b.name=name;b.kinematicMoon=true;b.moonHost=host;b.moonRadius=km/SOLAR_KM_PER_UNIT;b.moonPeriod=days*SOLAR_DAY;b.moonPhase=2*Math.PI*((index*.61803398875)%1);b.r=2;arr.push(b)})}placeMoons(arr,0)}
function placeMoons(arr,time){for(const b of arr){if(!b.kinematicMoon)continue;const host=b.moonHost,th=b.moonPhase+2*Math.PI*time/b.moonPeriod,r=b.moonRadius,om=2*Math.PI/b.moonPeriod;b.x=host.x+r*Math.cos(th);b.y=host.y+r*Math.sin(th);b.vx=host.vx-r*om*Math.sin(th);b.vy=host.vy+r*om*Math.cos(th);b.history=[[time,b.x,b.y,b.m]];const minStep=Math.max(.02,Math.min(2,Math.abs(r)*.015));if(!b.trail.length||Math.hypot(b.x-b.trail.at(-1)[0],b.y-b.trail.at(-1)[1])>=minStep)b.trail.push([b.x,b.y]);if(b.trail.length>3000)b.trail.shift()}}
function loadSolarSystem(){const sun=new Body(0,0,SOLAR_MASS,0,0,0);sun.name='Sol';const result=[sun];for(const[name,au,sm,degrees]of SOLAR_PLANETS){const r=au*SOLAR_AU,th=degrees*Math.PI/180,speed=Math.sqrt(SOLAR_G*SOLAR_MASS/r),b=new Body(r*Math.cos(th),r*Math.sin(th),SOLAR_MASS*sm,-speed*Math.sin(th),speed*Math.cos(th),0);b.name=name;result.push(b)}const total=result.reduce((s,b)=>s+b.m,0),cx=result.reduce((s,b)=>s+b.m*b.x,0)/total,cy=result.reduce((s,b)=>s+b.m*b.y,0)/total,cvx=result.reduce((s,b)=>s+b.m*b.vx,0)/total,cvy=result.reduce((s,b)=>s+b.m*b.vy,0)/total;result.forEach(b=>{b.x-=cx;b.y-=cy;b.vx-=cvx;b.vy-=cvy;b.history=[[0,b.x,b.y,b.m]]});appendMoons(result);return result}
function activateSolar(){bodies=loadSolarSystem();sources=bodies.filter(b=>!b.kinematicMoon);selected=tracked=null;sim=false;t=0;g=SOLAR_G;gSliderMax=Math.max(GMAX,Math.ceil(SOLAR_G/1000)*1000);instant=true;collisions=false;solarMode=true;cam.reset();cam.zoom=.00125;mass='1000';vx='0';vy='0';energyReference=energySignature=null;slingActive=false}
function drawSolarOrbits(){const sun=bodies.find(b=>b.name==='Sol');if(!sun)return;const colors=[[125,125,145],[190,155,110],[90,175,240],[205,120,95],[210,170,105],[185,170,125],[100,200,215],[110,130,230]];ctx.save();ctx.beginPath();ctx.rect(PANEL,0,W-PANEL,H);ctx.clip();SOLAR_PLANETS.forEach((p,idx)=>{const r=p[1]*SOLAR_AU,n=240;ctx.strokeStyle=rgb(colors[idx]);ctx.beginPath();for(let i=0;i<n;i++){const pt=cam.toScreen(sun.x+r*Math.cos(2*Math.PI*i/n),sun.y+r*Math.sin(2*Math.PI*i/n));i?ctx.lineTo(...pt):ctx.moveTo(...pt)}ctx.closePath();ctx.stroke()});ctx.restore()}

function panelHit(x,y,w,h,p=mouse){return p[0]>=x&&p[0]<=x+w&&p[1]>=y&&p[1]<=y+h}
function handleKeyDown(e){if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());if(e.key==='Escape'){if(selected)selected=null}else if(e.key.toLowerCase()==='p')activateSolar();else if(e.key===' '){sim=!sim}else if(e.key.toLowerCase()==='v')vectors=!vectors;else if(e.key.toLowerCase()==='f')fieldmode=(fieldmode+1)%3;else if(e.key.toLowerCase()==='t')trails=!trails;else if(e.key.toLowerCase()==='m')cm=!cm;else if(e.key.toLowerCase()==='h'){tracked=null;cam.reset()}else if(e.key.toLowerCase()==='c'){bodies=[];sources=[];selected=tracked=null}else if(e.key.toLowerCase()==='r'){bodies.forEach(b=>{b.vx=b.vy=0;b.record(t)});energyReference=null}else if(e.key==='Tab'){e.preventDefault();active=(active+1)%3}else if((e.key==='Delete'||e.key.toLowerCase()==='x')&&selected&&bodies.includes(selected)){selected.record(t);selected.destroyed=t;if(tracked===selected)tracked=null;bodies=bodies.filter(b=>b!==selected);selected=null}else if(e.key==='Enter'&&selected){const nm=+mass,nx=+vx,ny=+vy;if(Number.isFinite(nm)&&Math.abs(nm)>=EPS&&Number.isFinite(nx)&&Number.isFinite(ny)){selected.m=nm;[selected.vx,selected.vy]=selected.fixed?[0,0]:[nx,ny];selected.r=clamp(Math.trunc(Math.cbrt(Math.abs(nm))),4,70);selected.record(t);energyReference=null}}else if(e.key==='Backspace'){e.preventDefault();if(active===0)mass=mass.slice(0,-1);else if(active===1)vx=vx.slice(0,-1);else vy=vy.slice(0,-1)}else if(/[-0-9.eE+]/.test(e.key)&&e.key.length===1){if(active===0)mass+=e.key;else if(active===1)vx+=e.key;else vy+=e.key}}
addEventListener('keydown',handleKeyDown);addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function pointerPos(e){const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
canvas.addEventListener('pointermove',e=>{mouse=pointerPos(e);if(dragG)g=sval(mouse[0],20,290,GMIN,gSliderMax);if(dragC)c=sval(mouse[0],20,290,CMIN,CMAX,true);if(slingActive)slingCurrentScreen=mouse;if(dragCam){cam.pan(mouse[0]-lastMouse[0],mouse[1]-lastMouse[1]);lastMouse=[...mouse]}});
canvas.addEventListener('pointerdown',e=>{mouse=pointerPos(e);canvas.setPointerCapture(e.pointerId);if(e.button===0){if(panelHit(20,H-30,290,25)){activateSolar();return}if(panelHit(10,193,310,38)){dragG=true;g=sval(mouse[0],20,290,GMIN,gSliderMax);return}if(panelHit(10,248,310,38)){dragC=true;c=sval(mouse[0],20,290,CMIN,CMAX,true);return}if(panelHit(10,292,310,28)){instant=!instant;energyReference=null;return}if(panelHit(10,320,310,28)){collisions=!collisions;return}if(mouse[0]>PANEL){const b=hitBody(mouse);if(b){selected=tracked=b;mass=`${b.m}`;vx=`${b.vx}`;vy=`${b.vy}`;cam.follow(b)}else{const nm=+mass;if(Number.isFinite(nm)&&Math.abs(nm)>=EPS){slingActive=true;slingStartScreen=[...mouse];slingCurrentScreen=[...mouse];slingStartWorld=cam.toWorld(...mouse)}}}}else if(e.button===1){dragCam=true;lastMouse=[...mouse]}else if(e.button===2&&mouse[0]>PANEL){selected=hitBody(mouse);if(!selected){const nm=+mass;if(Number.isFinite(nm)&&Math.abs(nm)>=EPS){const[wx,wy]=cam.toWorld(...mouse),a=new Body(wx,wy,nm,0,0,t,true);bodies.push(a);sources.push(a)}}}});
canvas.addEventListener('pointerup',e=>{mouse=pointerPos(e);if(e.button===0){dragG=dragC=false;if(slingActive){slingCurrentScreen=[...mouse];const dist=Math.hypot(mouse[0]-slingStartScreen[0],mouse[1]-slingStartScreen[1]),nm=+mass;if(Number.isFinite(nm)&&Math.abs(nm)>=EPS){let lvx,lvy;if(dist>=SLINGSHOT_MIN_PIXELS){const cw=cam.toWorld(...slingCurrentScreen);lvx=(slingStartWorld[0]-cw[0])*SLINGSHOT_SCALE;lvy=(slingStartWorld[1]-cw[1])*SLINGSHOT_SCALE}else{lvx=+vx;lvy=+vy}if(Number.isFinite(lvx)&&Number.isFinite(lvy)){const b=new Body(slingStartWorld[0],slingStartWorld[1],nm,lvx,lvy,t);bodies.push(b);sources.push(b);selected=null}}slingActive=false}}else if(e.button===1)dragCam=false});
canvas.addEventListener('wheel',e=>{e.preventDefault();mouse=pointerPos(e);if(mouse[0]>PANEL)cam.zoomAt(mouse,Math.pow(1.15,-Math.sign(e.deltaY)))},{passive:false});canvas.addEventListener('contextmenu',e=>e.preventDefault());

function update(frame){const pan=500*frame;if(!tracked){if(keys.has('a')||keys.has('arrowleft'))cam.pan(pan,0);if(keys.has('d')||keys.has('arrowright'))cam.pan(-pan,0);if(keys.has('w')||keys.has('arrowup'))cam.pan(0,pan);if(keys.has('s')||keys.has('arrowdown'))cam.pan(0,-pan)}if(sim&&(bodies.length||sources.length)){const dt=(solarMode?SOLAR_DT:DT)/SUB;for(let i=0;i<SUB;i++){t=verletStep(bodies.filter(b=>!b.kinematicMoon),sources,g,c,t,dt,instant);if(solarMode)placeMoons(bodies,t);if(collisions)merge()}sources=sources.filter(b=>b.destroyed===null||b.destroyed>=t-HIST)}if(tracked&&bodies.includes(tracked))cam.follow(tracked);else if(tracked)tracked=null}
function drawPanel(){ctx.fillStyle=rgb(PC);ctx.fillRect(0,0,PANEL,H);ctx.strokeStyle=rgb(BORDER);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(PANEL,0);ctx.lineTo(PANEL,H);ctx.stroke();drawText('SIMULADOR GRAVITATORIO V6.9',15,15,20,TXT,true);drawText(sim?'Estado: EJECUCION':'Estado: PAUSA',15,48,18,sim?[90,255,140]:[255,190,80]);[['Masa',mass],['Velocidad X',vx],['Velocidad Y',vy]].forEach((a,i)=>drawText(`${i===active?'> ':'  '}${a[0]}: ${a[1]}`,15,80+i*32,18,i===active?[100,255,140]:TXT));slider(20,210,290,'G',g.toFixed(4),clamp(g/gSliderMax,0,1),'0',`${gSliderMax}`);const cr=(Math.log10(c)-Math.log10(CMIN))/(Math.log10(CMAX)-Math.log10(CMIN));slider(20,265,290,'Propagacion c',c.toFixed(1),cr,'10','10000');checkbox(20,295,'Propagacion instantanea',instant);checkbox(20,323,'Colisiones activadas',collisions);const modes=['oculto','vectorial','campo suave |g|'],lines=['CONTROLES','Clic masa: seleccionar y seguir','Clic derecho vacio: masa FIJA','Arrastrar vacio: lanzar esfera','P: cargar Sistema Solar',`F: campo ${modes[fieldmode]}`,'V: vectores | T: trazas | M: CM','DELETE: borrar con retardo','C: limpiar | H: dejar seguimiento','ESPACIO: iniciar/pausar','Rueda: zoom | boton medio: mover'];let yy=375;for(const line of lines){drawText(line,15,yy,14,line.startsWith('F:')?GREEN:TXT);yy+=17}drawText(`Cuerpos: ${bodies.length} (lunas: ${bodies.filter(b=>b.kinematicMoon).length})`,15,570,14);drawText(`Tiempo: ${t.toFixed(2)} s${solarMode?` | ${(t/60).toFixed(3)} anos`:''}`,15,590,14);drawText(`Seguimiento: ${tracked?'SI':'NO'}`,15,610,14);const arr=bodies.filter(b=>!b.kinematicMoon),[ek,ep,et]=energyComponents(arr,g),sig=JSON.stringify([arr.map(b=>[b.id,b.m,b.fixed]),g,collisions,instant,instant?null:c]);if(sig!==energySignature||energyReference===null)energyReference=et;energySignature=sig;const err=100*(et-energyReference)/Math.max(Math.abs(energyReference),1e-12);drawText(`E cinetica:  ${ek.toPrecision(6)}`,15,640,14);drawText(`E potencial: ${ep.toPrecision(6)}`,15,660,14);drawText(`E total:     ${et.toPrecision(6)}`,15,680,14);drawText(!collisions&&instant?`Delta E: ${err>=0?'+':''}${err.toFixed(5)}%`:'Delta E: n/a (retardo/colision)',15,700,14,!collisions&&instant?(Math.abs(err)<.1?GREEN:YEL):MUT);drawText(solarMode?'Solar: 1 UA=10000 | 1 ano=60 s':'Unidades internas del simulador',15,727,14,MUT);drawText('Fijas: restriccion externa',15,747,14,MUT);const by=H-30;ctx.fillStyle=panelHit(20,by,290,25)?'rgb(48,104,150)':'rgb(42,75,113)';roundRect(20,by,290,25,5,true,false);ctx.strokeStyle='rgb(100,180,230)';ctx.lineWidth=2;roundRect(20,by,290,25,5,false,true);const label='CARGAR SISTEMA SOLAR (P)';ctx.font='14px Consolas, monospace';drawText(label,20+(290-ctx.measureText(label).width)/2,by+5,14)}
function render(){ctx.fillStyle=rgb(BG);ctx.fillRect(0,0,W,H);const[ox,oy]=cam.toScreen(0,0);ctx.strokeStyle=rgb(AXIS);ctx.lineWidth=1;if(oy>=0&&oy<=H){ctx.beginPath();ctx.moveTo(PANEL,oy);ctx.lineTo(W,oy);ctx.stroke()}if(ox>=PANEL&&ox<=W){ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,H);ctx.stroke()}if(fieldmode===1)drawFieldVectors();else if(fieldmode===2)drawIntensityBands();if(solarMode)drawSolarOrbits();for(const b of bodies){if(b.kinematicMoon&&cam.zoom*b.moonRadius<.15)continue;b.draw(trails,vectors,b===selected)}if(slingActive&&slingStartScreen&&slingCurrentScreen){const start=slingStartScreen,current=slingCurrentScreen,cw=cam.toWorld(...current),pvx=(slingStartWorld[0]-cw[0])*SLINGSHOT_SCALE,pvy=(slingStartWorld[1]-cw[1])*SLINGSHOT_SCALE,speed=Math.hypot(pvx,pvy),pm=+mass,pr=Number.isFinite(pm)?clamp(Math.trunc(Math.cbrt(Math.abs(pm))),4,70):4;if(Number.isFinite(pm))drawDottedTrajectory(predictTrajectory(slingStartWorld[0],slingStartWorld[1],pvx,pvy,pr));ctx.strokeStyle='rgb(255,180,80)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(...start);ctx.lineTo(...current);ctx.stroke();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.beginPath();ctx.arc(start[0],start[1],8,0,Math.PI*2);ctx.stroke();const ae=[start[0]+(start[0]-current[0]),start[1]+(start[1]-current[1])];ctx.strokeStyle='rgb(100,255,140)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(...start);ctx.lineTo(...ae);ctx.stroke();ctx.fillStyle='rgb(100,255,140)';ctx.beginPath();ctx.arc(ae[0],ae[1],5,0,Math.PI*2);ctx.fill();const lines=[`Vx: ${pvx.toFixed(2)}`,`Vy: ${pvy.toFixed(2)}`,`Rapidez: ${speed.toFixed(2)}`],bw=130,bh=63;let bx=current[0]+18,by=current[1]+30;if(bx+bw>W-6)bx=current[0]-bw-18;if(by+bh>H-6)by=current[1]-bh-18;bx=clamp(bx,PANEL+6,W-bw-6);by=clamp(by,6,H-bh-6);ctx.fillStyle='rgb(20,23,34)';roundRect(bx,by,bw,bh,6,true,false);ctx.strokeStyle='rgb(100,255,140)';ctx.lineWidth=2;roundRect(bx,by,bw,bh,6,false,true);lines.forEach((q,i)=>drawText(q,bx+8,by+8+i*18,14));}if(cm&&bodies.length){const mt=bodies.reduce((s,b)=>s+b.m,0);if(Math.abs(mt)>EPS){const cx=bodies.reduce((s,b)=>s+b.m*b.x,0)/mt,cy=bodies.reduce((s,b)=>s+b.m*b.y,0)/mt,[sx,sy]=cam.toScreen(cx,cy);ctx.strokeStyle=rgb(CYAN);ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,12,0,Math.PI*2);ctx.stroke()}}drawPanel();if(mouse[0]>PANEL){const[wx,wy]=cam.toWorld(...mouse);drawText(`(${wx.toFixed(2)}, ${wy.toFixed(2)})`,mouse[0]+12,mouse[1]+12,14)}}
let last=performance.now();function loop(now){const frame=Math.min(.05,(now-last)/1000);last=now;update(frame);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
